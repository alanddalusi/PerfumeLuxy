{% extends "admin/change_form.html" %}
{% block object-tools-items %}
  {{ block.super }}
  {% if original and perms.products.approve_catalogimage and has_change_permission %}
    <li><form method="post" action="{% url 'admin:products_catalogimage_decision' original.pk 'approve' %}">
      {% csrf_token %}<button type="submit">Confirmar derechos y aprobar imagen</button>
    </form></li>
    <li><form method="post" action="{% url 'admin:products_catalogimage_decision' original.pk 'withdraw' %}">
      {% csrf_token %}<button type="submit">Retirar imagen</button>
    </form></li>
  {% endif %}
{% endblock %}
