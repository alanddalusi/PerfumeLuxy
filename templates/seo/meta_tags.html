<!-- SEO Template Tags - Include en <head> de base.html -->
{% comment %}
Sistema SEO completo con meta tags, OpenGraph, Twitter Cards, y Schema.org
Uso en templates:
{% include 'seo/meta_tags.html' with seo_data=seo_data %}
{% endcomment %}

<!-- Meta Tags Básicos -->
<title>{{ seo_data.title|default:"PerfumeLuxe - Perfumes Auténticos de Lujo | Envío Gratis +50€" }}</title>
<meta name="description" content="{{ seo_data.meta_description|default:"Descubre PerfumeLuxe - Fragancias 100% auténticas. Envío gratis +50€, devolución 30 días." }}" />
<meta name="keywords" content="{{ seo_data.meta_keywords|default:"perfumes auténticos, fragancias de lujo, comprar perfume online" }}" />
<meta name="author" content="PerfumeLuxe" />
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

<!-- Canonical URL -->
<link rel="canonical" href="{{ seo_data.canonical_url|default:request.build_absolute_uri }}" />

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{{ seo_data.og_type|default:'website' }}" />
<meta property="og:url" content="{{ seo_data.og_url|default:request.build_absolute_uri }}" />
<meta property="og:title" content="{{ seo_data.og_title|default:seo_data.title }}" />
<meta property="og:description" content="{{ seo_data.og_description|default:seo_data.meta_description }}" />
<meta property="og:image" content="{{ seo_data.og_image|default:seo.default_image }}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:site_name" content="PerfumeLuxe" />
<meta property="og:locale" content="es_ES" />

<!-- Twitter Card -->
<meta name="twitter:card" content="{{ seo_data.twitter_card|default:'summary_large_image' }}" />
<meta name="twitter:url" content="{{ seo_data.og_url|default:request.build_absolute_uri }}" />
<meta name="twitter:title" content="{{ seo_data.twitter_title|default:seo_data.title }}" />
<meta name="twitter:description" content="{{ seo_data.twitter_description|default:seo_data.meta_description }}" />
<meta name="twitter:image" content="{{ seo_data.twitter_image|default:seo.default_image }}" />
<meta name="twitter:creator" content="@perfumeluxe" />

<!-- Additional Meta Tags -->
<meta name="theme-color" content="#d4af37" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
