<meta name="description" content="{{ seo_data.meta_description }}">
<meta name="robots" content="{{ seo_data.robots|default:'index, follow, max-image-preview:large' }}">
<link rel="canonical" href="{{ seo_data.canonical_url }}">
<meta property="og:type" content="{{ seo_data.og_type }}">
<meta property="og:url" content="{{ seo_data.og_url }}">
<meta property="og:title" content="{{ seo_data.og_title }}">
<meta property="og:description" content="{{ seo_data.og_description }}">
<meta property="og:site_name" content="Perfumería El Buen Olor">
<meta property="og:locale" content="es_ES">
{% if seo_data.og_image %}<meta property="og:image" content="{{ seo_data.og_image }}">
{% if seo_data.og_image_width %}<meta property="og:image:width" content="{{ seo_data.og_image_width }}">
<meta property="og:image:height" content="{{ seo_data.og_image_height }}">{% endif %}
{% if seo_data.og_image_alt %}<meta property="og:image:alt" content="{{ seo_data.og_image_alt }}">{% endif %}{% endif %}
<meta name="twitter:card" content="{{ seo_data.twitter_card }}">
<meta name="twitter:title" content="{{ seo_data.twitter_title }}">
<meta name="twitter:description" content="{{ seo_data.twitter_description }}">
{% if seo_data.twitter_image %}<meta name="twitter:image" content="{{ seo_data.twitter_image }}">
{% if seo_data.og_image_alt %}<meta name="twitter:image:alt" content="{{ seo_data.og_image_alt }}">{% endif %}{% endif %}
<meta name="theme-color" content="#FAF8F3">
