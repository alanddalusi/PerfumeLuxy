{% load static %}

<!-- Schema.org Product Structured Data for SEO -->
<script type="application/ld+json">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "{{ product.brand.name }} {{ product.name }}",
  "image": [
    "{% if product.image %}{{ request.scheme }}://{{ request.get_host }}{{ product.image.url }}{% else %}{{ request.scheme }}://{{ request.get_host }}{{ MEDIA_URL }}noimage.png{% endif %}"
  ],
  "description": "{{ product.description|default:'Perfume de lujo '|add:product.brand.name|add:' '|add:product.name|striptags|truncatewords:30 }}",
  "sku": "{{ product.sku|default:product.id }}",
  "brand": {
    "@type": "Brand",
    "name": "{{ product.brand.name }}"
  },
  {% if product.category %}
  "category": "{{ product.category.name }}",
  {% endif %}
  "offers": {
    "@type": "Offer",
    "url": "{{ request.build_absolute_uri }}",
    "priceCurrency": "EUR",
    "price": "{{ product.discounted_price|default:product.price }}",
    "priceValidUntil": "{% now 'Y' as year %}{{ year|add:'1' }}-12-31",
    "availability": "{% if product.stock > 0 %}https://schema.org/InStock{% else %}https://schema.org/OutOfStock{% endif %}",
    "itemCondition": "https://schema.org/NewCondition",
    "seller": {
      "@type": "Organization",
      "name": "PerfumeLuxe"
    }
  }{% if reviews %},
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "{{ average_rating|default:4.5 }}",
    "reviewCount": "{{ review_count|default:0 }}"
  }{% endif %}{% if reviews %},
  "review": [
    {% for review in reviews %}
    {
      "@type": "Review",
      "reviewRating": {
        "@type": "Rating",
        "ratingValue": "{{ review.rating }}",
        "bestRating": "5"
      },
      "author": {
        "@type": "Person",
        "name": "{{ review.user.get_full_name|default:review.user.username }}"
      },
      "datePublished": "{{ review.created_at|date:'Y-m-d' }}",
      "reviewBody": "{{ review.comment|striptags }}"
    }{% if not forloop.last %},{% endif %}
    {% endfor %}
  ]{% endif %}
}
</script>

<!-- Organization Schema for Brand Trust -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "PerfumeLuxe",
  "url": "{{ request.scheme }}://{{ request.get_host }}",
  "logo": "{{ request.scheme }}://{{ request.get_host }}{% static 'img/logo.png' %}",
  "description": "Tienda online de perfumes auténticos de lujo. Marcas premium con garantía de autenticidad.",
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "customer service",
    "email": "info@perfumeluxy.com"
  },
  "sameAs": [
    "https://www.instagram.com/perfumeluxy",
    "https://www.facebook.com/perfumeluxy",
    "https://twitter.com/perfumeluxy"
  ]
}
</script>
