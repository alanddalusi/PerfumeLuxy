# IMITATION of Foro IA al Día for the rehearsal VM only. Same project, container and
# network names as production so the real scripts run unchanged. Every resource carries
# the label perfumeria.rehearsal=true; rehearsal.sh refuses to touch anything without it.
# Never start this on the real VPS (rehearsal.sh aborts if a real forum is present).

name: foroia-production

services:
  caddy:
    image: caddy:2.8-alpine
    labels: { perfumeria.rehearsal: "true" }
    ports:
      - "127.0.0.1:${SIM_HTTP_PORT:-28080}:80"
      - "127.0.0.1:${SIM_HTTPS_PORT:-28443}:443"
    volumes:
      # Single-file bind mount, the most fragile case for in-place edits.
      - ${FORO_SIM_DIR:?}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, backend]
    restart: unless-stopped

  # Generic service name on purpose: perfumeria must never answer to "web".
  web:
    image: traefik/whoami:v1.10.3
    labels: { perfumeria.rehearsal: "true" }
    command: ["--name", "foro-sim-web"]
    networks: [edge, backend]
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    labels: { perfumeria.rehearsal: "true" }
    environment:
      POSTGRES_DB: foro
      POSTGRES_USER: foro
      POSTGRES_PASSWORD: ${FORO_SIM_DB_PASSWORD:?}
    volumes:
      - foro_db:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foro -d foro"]
      interval: 5s
      retries: 20
    restart: unless-stopped

networks:
  edge:
    labels: { perfumeria.rehearsal: "true" }
  backend:
    labels: { perfumeria.rehearsal: "true" }

volumes:
  caddy_data:
    labels: { perfumeria.rehearsal: "true" }
  caddy_config:
    labels: { perfumeria.rehearsal: "true" }
  foro_db:
    labels: { perfumeria.rehearsal: "true" }
